name: Generate profile snake (GIF)

on:
  schedule:
    - cron: "0 3 * * *" # daily
  workflow_dispatch:

jobs:
  snake:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate snake GIFs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake-dark.gif?color_snake=00ff66&color_dots=#9ae6b4,#63b3ed,#90cdf4,#b2f5ea,#68d391&color_background=0b1220
            dist/github-contribution-grid-snake-light.gif?color_snake=00a859&color_dots=#1d4ed8,#2563eb,#3b82f6,#60a5fa,#93c5fd&color_background=f8fafc

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: update profile snake GIFs"
          git push
